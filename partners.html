<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Axetron Gaming - ATR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #000;
      color: #f5f5f5;
    }

    header {
      display: flex;
      align-items: center;
      padding: 20px 40px;
      background-color: #000;
      border-bottom: 1px solid #f1c40f;
    }

    header img {
      height: 50px;
      margin-right: 15px;
    }

    header h1 {
      color: #f1c40f;
      font-size: 24px;
    }

    nav {
      background-color: #000;
      padding: 15px 40px;
      border-bottom: 1px solid #f1c40f;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav ul li a {
      text-decoration: none;
      color: #f1c40f;
      font-weight: bold;
      font-size: 16px;
      position: relative;
    }

    nav ul li a::after {
      content: "";
      position: absolute;
      width: 0%;
      height: 2px;
      bottom: -5px;
      left: 0;
      background-color: #f1c40f;
      transition: width 0.3s ease;
    }

    nav ul li a:hover::after {
      width: 100%;
    }

    .banner {
      position: relative;
      width: 100%;
      height: 80vh;
      background: url('atr.jpg') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .banner::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .banner-content {
      position: relative;
      z-index: 2;
      color: #fff;
      animation: fadeInUp 1.5s ease-out;
    }

    .banner-content h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .banner-content p {
      font-size: 20px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    section {
      padding: 60px 40px;
      text-align: center;
    }

    section h2 {
      color: #f1c40f;
      font-size: 32px;
      margin-bottom: 20px;
    }

    .card, .trophies .card, .creators .card, .partners .card {
      background-color: #111;
      border: 1px solid #f1c40f33;
      border-radius: 12px;
      padding: 15px;
      margin: 10px;
      display: inline-block;
      width: 250px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .video iframe {
      width: 90%;
      height: 400px;
      border-radius: 10px;
    }

    .social a {
      display: inline-block;
      margin: 10px;
      color: #f1c40f;
      text-decoration: none;
      font-weight: bold;
    }

    .main-footer {
      background: #000;
      padding: 20px;
      text-align: center;
      border-top: 1px solid #f1c40f;
    }

    .main-footer p {
      color: #ccc;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      nav ul {
        flex-direction: column;
        gap: 15px;
      }

      .banner-content h1 {
        font-size: 32px;
      }

      .banner-content p {
        font-size: 16px;
      }

      .video iframe {
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="atr.png" alt="ATR Logo">
    <h1>AXETRON GAMING</h1>
  </header>

  <nav>
    <ul>
      <li><a href="legacy.html">Our Legacy</a>
      <li><a href="feed.html">Esports Feed</a>
      <li><a href="teams.html">Esports Teams</a>
      <li><a href="trophies.html">Trophies & Titles</a>
      <li><a href="partners.html">Partners</a>
      <li><a href="contact.html">Contact</a>
    </ul>
  </nav>
<section id="partners">
  <h2 style="text-align:center; color:#e91e63; margin-top:40px;">Partners</h2>
  <div class="partners-container">
    <div class="partner-card">
      <img src="stom.png" alt="Collaborate Partner" class="animated-img">
      <h3>COLLABORATE PARTNER</h3>
    </div>
    <div class="partner-card">
      <img src="ja.png" alt="Media Partner" class="animated-img">
      <h3>MEDIA PARTNER</h3>
    </div>
  </div>
</section>

<footer class="footer">
  &copy; 2025 Axetron Gaming — All rights reserved.
</footer>

  .partner-card h3 {

  .animated-img {

  .footer {
    background-color: #111;
    color: #aaa;

    margin-top: 40px;

  }

  @media (max-width: 600px) {
